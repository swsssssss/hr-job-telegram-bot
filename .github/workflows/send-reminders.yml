name: HR Job Reminders

on:
  schedule:
    # 08:00 HKT (00:xx UTC) and 20:00 HKT (12:xx UTC). GitHub may run late;
    # already_sent_today ensures one morning + one evening send per day.
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 0 * * *"
    # 20:00 HKT window (12:00–12:55 UTC)
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 12 * * *"
  repository_dispatch:
    types:
      - morning_reminder
      - evening_reminder
  workflow_dispatch:
    inputs:
      slot:
        description: Reminder slot
        required: true
        default: morning
        type: choice
        options:
          - morning
          - evening
      force:
        description: Send even if already sent today or outside HKT window
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: hr-job-bot-data
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve slot and flags
        id: slot
        run: |
          FORCE=""
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            case "${{ github.event.action }}" in
              morning_reminder) SLOT="morning" ;;
              evening_reminder) SLOT="evening" ;;
              *) SLOT="morning" ;;
            esac
          else
            SLOT=$(python scripts/resolve_slot.py "${{ github.event.schedule }}" "${{ github.event.inputs.slot || 'morning' }}")
            if [[ "${{ github.event.inputs.force }}" == "true" ]]; then
              FORCE="--force"
            fi
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
          echo "Resolved slot=$SLOT force=$FORCE"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Telegram env
        run: |
          {
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}"
            echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}"
          } > .env

      - name: Send reminder
        run: python src/main.py --slot "${{ steps.slot.outputs.slot }}" ${{ steps.slot.outputs.force }}

      - name: Commit bot data
        run: bash scripts/commit_bot_data.sh "Update bot data after ${{ steps.slot.outputs.slot }} reminder [skip ci]"
