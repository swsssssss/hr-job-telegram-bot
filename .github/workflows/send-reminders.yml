name: HR Job Reminders

on:
  schedule:
    # 08:00 HKT (00:00 UTC) + backups every 30 min until 11:30 HKT
    - cron: "0 0 * * *"
    - cron: "30 0 * * *"
    - cron: "0 1 * * *"
    - cron: "30 1 * * *"
    - cron: "0 2 * * *"
    - cron: "30 2 * * *"
    - cron: "0 3 * * *"
    - cron: "30 3 * * *"
    # 20:00 HKT (12:00 UTC) + backups every 30 min until 23:30 HKT
    - cron: "0 12 * * *"
    - cron: "30 12 * * *"
    - cron: "0 13 * * *"
    - cron: "30 13 * * *"
    - cron: "0 14 * * *"
    - cron: "30 14 * * *"
    - cron: "0 15 * * *"
    - cron: "30 15 * * *"
    # 20:05 HKT (12:05 UTC) + backups
    - cron: "5 12 * * *"
    - cron: "35 12 * * *"
    - cron: "5 13 * * *"
    - cron: "35 13 * * *"
    - cron: "5 14 * * *"
    - cron: "35 14 * * *"
    - cron: "5 15 * * *"
    - cron: "35 15 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: Reminder slot
        required: true
        default: morning
        type: choice
        options:
          - morning
          - evening
          - applied_summary
      force:
        description: Send even if already sent today
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: hr-job-bot-data
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve slot
        id: slot
        run: |
          SLOT=$(python scripts/resolve_slot.py "${{ github.event.schedule }}" "${{ github.event.inputs.slot || 'morning' }}")
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "Resolved slot: $SLOT (cron: ${{ github.event.schedule }})"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Telegram env
        run: |
          {
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}"
            echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}"
          } > .env

      - name: Send reminder
        run: |
          FORCE_FLAG=""
          if [[ "${{ github.event.inputs.force }}" == "true" ]]; then
            FORCE_FLAG="--force"
          fi
          python src/main.py --slot "${{ steps.slot.outputs.slot }}" $FORCE_FLAG

      - name: Commit bot data
        run: bash scripts/commit_bot_data.sh "Update bot data after ${{ steps.slot.outputs.slot }} reminder [skip ci]"
