name: HR Job Bot Listener

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hr-job-bot-data
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Telegram env
        run: |
          {
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}"
            echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}"
          } > .env

      - name: Process Telegram commands
        run: python scripts/cloud_listener_once.py

      - name: Commit bot data
        run: bash scripts/commit_bot_data.sh "Update bot data from Telegram commands [skip ci]"
